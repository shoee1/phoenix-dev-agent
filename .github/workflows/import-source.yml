name: Import canonical Phoenix source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified v1.0.6 payload
        shell: bash
        run: |
          set -euo pipefail
          cat release/parts/v1.0.6/payload.part* > /tmp/phoenix-payload.b64
          base64 -d /tmp/phoenix-payload.b64 > /tmp/phoenix-payload.tgz
          echo '05058ce77643aadf71ff7c1f928e3d10305d5b9026162046200b19d456ddb13c  /tmp/phoenix-payload.tgz' | sha256sum -c -

      - name: Import canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir -p source
          tar -xzf /tmp/phoenix-payload.tgz -C source
          find source -maxdepth 3 -type f -print | sort

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phoenix Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add source
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Import canonical source from verified v1.0.6 payload [skip ci]'
          git push
